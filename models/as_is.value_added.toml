# Value-added classification of every task in models/as_is.bpmn (book §6.1, pp.213-218).
# Signed off by the student on 2026-11-05 (ticket 09). Reasoning: docs/analysis/phase1-qualitative.md;
# borderline calls: docs/analysis/value-added-borderline-tasks.md.
#
# Customer of the process: the business unit that asked for the application, an internal
# customer (§1.2, p.5: the one who consumes the output).
# Positive outcome for them: a working, secure application in live operation that does what they asked.
# VA = the customer would see the outcome as less valuable without it (p.214).
# BVA = the bank needs it (control, risk, regulation, records) but the customer doesn't pay for it (p.214).
# NVA = neither (p.215). Rework and handoffs end up here.
#
# The book classifies steps, which can be finer than tasks (p.213). Here each task gets the
# class of its main step, so a task can still hide a few NVA steps (e.g. waiting for a meeting slot).

[Task_RegisterRequest]
class = "VA"
reason = "The business unit fills in its own request; nothing can start without it. The book classes \"Fill request\" as VA (Table 6.1, p.217). The logging part is BVA but smaller."

[Task_ApproveProposal]
class = "BVA"
reason = "Control step (p.216): management checks budget and fit before money is spent."

[Task_ReviseProposal]
class = "NVA"
reason = "Rework on a proposal that wasn't accepted the first time; defect waste (p.222)."

[Task_HoldKickOff]
class = "BVA"
reason = "Aligns the business unit and IT on scope and roles, which lowers project risk; the customer doesn't pay for the meeting."

[Task_SpecifyRequirements]
class = "VA"
reason = "Decides what the application will do; without it the customer gets a less useful result."

[Task_DraftPlan]
class = "BVA"
reason = "Needed to book people and dates and to control the project; the plan itself adds nothing to the application."

[Task_ApprovePlan]
class = "BVA"
reason = "Control step (p.216) on the plan."

[Task_BuildApplication]
class = "VA"
reason = "Produces the application the customer asked for."

[Task_ReviewSourceCode]
class = "BVA"
reason = "Control step (p.216): checks the code was written correctly."

[Task_RunFunctionalTests]
class = "BVA"
reason = "Control step (p.216): checks the application works as specified."

[Task_RunSecurityTests]
class = "BVA"
reason = "Control step required by the bank's security rules; reduces the risk of losses (p.214)."

[Task_RunAcceptanceTests]
class = "BVA"
reason = "Control step (p.216): the acceptance unit confirms the application meets the request before release."

[Task_FixDefects]
class = "NVA"
reason = "Repairs defects found in testing; rework is defect waste (p.222)."

[Task_ApproveRelease]
class = "BVA"
reason = "Control step (p.216): management signs off the release before production."

[Task_RefineApplication]
class = "NVA"
reason = "Rework after a rejected release (p.222). Could be VA if it adds missing scope, see answered question 6 in the change log."

[Task_DeployApplication]
class = "VA"
reason = "Puts the application where users can use it; the customer gets no value before this."

[Task_StartOperation]
class = "BVA"
reason = "Formal go-live and handover to operations; the application is already deployed, so this is mostly sign-off."

[Task_MonitorOperation]
class = "BVA"
reason = "Keeps the application stable after go-live and lowers the risk of incidents (p.214)."

[Task_EvaluateProject]
class = "BVA"
reason = "Archives project records and collects lessons learned; useful to the bank, not to the requester."
