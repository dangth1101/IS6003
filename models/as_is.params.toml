# Proposed default parameters for the corrected as-is model (models/as_is.bpmn).
#
# Context: the application development process of a bank's IT division. A case is
# one development request, from registration to project closure. Time is in
# working days on a continuous clock (no calendar). Task durations are the time
# a resource of the lane spends on the task; waiting for a free resource comes
# on top, from the lane capacities.
#
# Every value is a proposed default, an estimate for the student to correct. None
# of it is measured. The planted attribute effects, and what the ML should find,
# are listed in models/as_is_planted_effects.md.
#
# Targets these defaults aim for (checked in tests/test_as_is_parameters.py on a
# 2,000-case log, seed 42):
# - mean cycle time of a closed project 120-200 working days (6-10 months)
# - 7-13% of requests rejected, 15-25% of proposal decisions ask for changes
# - 15-25% of plans sent back
# - 30-45% of test rounds find defects, 30-50% of projects fail testing at least once
# - 5-12% of releases rejected
# - waiting 10-40% of the cycle time
# - every lane busy 70-95% of the time (utilisation below 1, so queues settle),
#   QC the busiest at about 0.88

version = "proposed-1"

[arrivals]
rate = 0.25
rationale = "Proposed default. About one new request a week (62 a year), plausible for the change portfolio of a mid-size bank's IT division."

[warm_up]
length = 250
rationale = "Proposed default. One working year, long enough for every lane queue to fill from the empty start; cases arriving before it are dropped from the log."

# Case attributes, drawn once per case at arrival.

[attributes.project_type]
distribution = { choice = ["enhancement", "new_system", "regulatory"], weights = [0.55, 0.25, 0.2] }
rationale = "Proposed default. Most requests change an existing system; new systems and regulatory changes (e.g. central bank reporting) are the rest."

[attributes.complexity]
distribution = { choice = [1, 2, 3], weights = [0.35, 0.45, 0.2] }
rationale = "Proposed default. Ordinal scale 1 low, 2 medium, 3 high, as rated at intake. Medium is most common."

[attributes.integrations]
distribution = { poisson = 2.0 }
rationale = "Proposed default. Number of other systems the application connects to (core banking, CRM, payment gateway, ...). Two on average."

[attributes.security_level]
distribution = { choice = [1, 2, 3], weights = [0.4, 0.4, 0.2] }
rationale = "Proposed default. Data classification: 1 internal data, 2 customer data, 3 payments or other critical data."

[attributes.requesting_unit]
distribution = { choice = ["retail", "corporate", "treasury", "operations", "risk_compliance"], weights = [0.35, 0.2, 0.1, 0.2, 0.15] }
rationale = "Proposed default. Retail banking sends the most requests. Has no effect in the simulation on purpose: a negative control for the ML."

[attributes.team_workload]
distribution = { triangular = [0.5, 0.8, 1.0] }
rationale = "Proposed default. Share of the development team already allocated when the request arrives, as reported at intake. Usually high."

# Lanes are resource pools: the number of people or teams that can work on a task of the lane at once.

[lanes.Lane_BusinessUnit]
capacity = 5
rationale = "Proposed default. Five business analysts or PMO staff who register requests, run kick-offs and write requirements."

[lanes.Lane_ITManagement]
capacity = 3
rationale = "Proposed default. Three IT managers who review proposals, plans and releases."

[lanes.Lane_Development]
capacity = 13
rationale = "Proposed default. Thirteen development teams, each working on one task at a time."

[lanes.Lane_QualityControl]
capacity = 8
rationale = "Proposed default. Eight QC testers or test teams. Kept the tightest lane, since testing is a common bottleneck in bank IT."

[lanes.Lane_ITOperations]
capacity = 5
rationale = "Proposed default. Five operations and app support staff who also revise proposals and run hypercare."

# Tasks, in process order. Triangular [min, mode, max] in working days.

[tasks.Task_RegisterRequest]
duration = { triangular = [0.5, 1, 2] }
rationale = "Proposed default. Filling in the request form and logging it, about a day."

[tasks.Task_ApproveProposal]
duration = { triangular = [2, 4, 8] }
rationale = "Proposed default. Reading the proposal, asking questions and deciding, about a week of a manager's attention."

[tasks.Task_ReviseProposal]
duration = { triangular = [2, 4, 8] }
rationale = "Proposed default. Reworking the proposal on the managers' comments, about as long as reviewing it."

[tasks.Task_HoldKickOff]
duration = { triangular = [0.5, 1, 2] }
rationale = "Proposed default. Preparing and holding one kick-off meeting."

[tasks.Task_SpecifyRequirements]
duration = { triangular = [5, 8, 16], scale = { complexity = 0.3 } }
rationale = "Proposed default. Business and technical requirements take two to five weeks, 30% of the base more per complexity step. About 15 days on average."

[tasks.Task_DraftPlan]
duration = { triangular = [2, 4, 7] }
rationale = "Proposed default. Estimating and scheduling the work, about a week."

[tasks.Task_ApprovePlan]
duration = { triangular = [1, 2, 4] }
rationale = "Proposed default. Plan review is lighter than proposal review."

[tasks.Task_BuildApplication]
duration = { triangular = [8, 14, 25], scale = { complexity = 0.4, integrations = 0.1, team_workload = 0.6 } }
rationale = "Proposed default. A base of two to five weeks, then 40% of the base more per complexity step, 10% per integration and 60% for a fully loaded team. About 38 days on average (about 27 for a simple app with no integrations and a light load, about 45 for a typical complex one), the longest task, as in most bank projects."

[tasks.Task_ReviewSourceCode]
duration = { triangular = [1, 2, 4] }
rationale = "Proposed default. A code review takes a few days."

[tasks.Task_RunFunctionalTests]
duration = { triangular = [3, 6, 10] }
rationale = "Proposed default. One to two weeks of functional testing per round, mostly manual regression testing."

[tasks.Task_RunSecurityTests]
duration = { triangular = [1, 2, 4], scale = { security_level = 0.5 } }
rationale = "Proposed default. Vulnerability scan and review, 50% longer per security level step, since critical systems also get penetration testing."

[tasks.Task_RunAcceptanceTests]
duration = { triangular = [2, 4, 8] }
rationale = "Proposed default. User acceptance testing with the business unit, about a week per round."

[tasks.Task_FixDefects]
duration = { triangular = [2, 4, 8] }
rationale = "Proposed default. Fixing the defects found in one test round, about a week."

[tasks.Task_ApproveRelease]
duration = { triangular = [0.5, 1, 2] }
rationale = "Proposed default. Release approval at the change advisory board, about a day."

[tasks.Task_RefineApplication]
duration = { triangular = [3, 5, 10] }
rationale = "Proposed default. Changes asked for at release approval are larger than defect fixes."

[tasks.Task_DeployApplication]
duration = { triangular = [0.5, 1, 2] }
rationale = "Proposed default. One deployment window."

[tasks.Task_StartOperation]
duration = { triangular = [0.5, 1, 2] }
rationale = "Proposed default. Handover to operations and go-live checks."

[tasks.Task_MonitorOperation]
duration = { triangular = [5, 10, 20] }
rationale = "Proposed default. About two weeks of hypercare after go-live, counted in the cycle time (open question in the change log)."

[tasks.Task_EvaluateProject]
duration = { triangular = [1, 2, 4] }
rationale = "Proposed default. Closing report and lessons learned."

# XOR-splits. A logistic branch is 1 / (1 + exp(-z)), z = intercept + attribute terms.

[gateways.Gateway_ProposalSplit]
branches = { Flow_ProposalApproved = 0.72, Flow_ProposalChangesRequested = 0.2, Flow_ProposalRejected = 0.08 }
rationale = "Proposed default. One proposal decision in five asks for changes and 8% reject outright, so about 10% of requests end rejected. A three-way split can't be logistic, so no attribute effect here."

[gateways.Gateway_PlanSplit]
branches = { Flow_PlanApproved = "rest", Flow_PlanChangesRequested = { logistic = { intercept = -1.8, project_type = { new_system = 1.0 } } } }
rationale = "Proposed default. 14% of plans sent back, 31% for a new system, whose estimates are least certain. About 18% overall."

[gateways.Gateway_TestSplit]
branches = { Flow_TestsPassed = "rest", Flow_DefectsFound = { logistic = { intercept = -3.0, complexity = 0.6, integrations = 0.15, security_level = 0.5 } } }
rationale = "Proposed default. About a third of test rounds find defects: 13% for a simple internal app, over 70% for a complex, highly integrated payments app. Security level acts here because the four checks share one decision."

[gateways.Gateway_ReleaseSplit]
branches = { Flow_ReleaseApproved = "rest", Flow_ReleaseRejected = { logistic = { intercept = -2.6, project_type = { regulatory = 1.0 } } } }
rationale = "Proposed default. 7% of releases rejected, 17% for regulatory changes, which compliance signs off at release. About 9% overall."
