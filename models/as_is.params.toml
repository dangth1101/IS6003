# Placeholder parameters for the corrected as-is model (models/as_is.bpmn).
# Fixed durations in working days, fixed branch probabilities, unlimited lanes,
# every case arriving at time 0. They only prove the model runs end to end.
# Ticket 10 replaces this file with the proposed defaults (distributions,
# attribute effects, arrivals, lane capacities, warm-up).

