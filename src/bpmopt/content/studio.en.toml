# Studio text, English. scripts/build_studio.py copies it to web/studio/studio.en.json,
# which the studio page reads (a test checks the copy is current).
# To translate the studio, copy this file (e.g. studio.vi.toml) and edit the strings.
# Labels may contain {name} placeholders. Keep the placeholder names as they are.

