# Threats to validity, shown under Assumptions. build_results copies them into `threats`.
[[threats]]
title = "The data is synthetic"
detail = "The event log comes from our own simulator, so the machine learning partly finds effects we put in ourselves. It finds the strong ones (complexity, security level, integrations) and never ranks the attribute with no effect first. That shows the method works. It doesn't show these are the drivers in the real process."

[[threats]]
title = "Parameters are estimates"
detail = "Durations, branch probabilities, the arrival rate and lane capacities are proposed defaults and the student's answers, not measurements. The book says simulation inputs should come from observation where possible and be checked with the people who run the process (§7.3.4, p.287)."

[[threats]]
title = "The effects of the changes are assumed"
detail = "C3 is the least certain. How much longer the extended requirements take, and how many fewer defects they lead to, are both guesses. C2 assumes how long a retest takes, and that it finds new defects as often as a full test round. These values are in the assumptions table, marked with their change. Other values in models/to_be.catalog.toml could change which change helps most."

[[threats]]
title = "The groups depend on choices"
detail = "The number of groups is picked by silhouette from a fixed range. For the cases the silhouette still rises at the top of that range: the paths are distinct variants, so more groups always fit a little better, and we cap the count to keep the groups readable. The vectors also depend on the embedding settings and the seed. The groups describe simulated paths, so they can only find attribute effects the simulator put in."

[[threats]]
title = "No working calendar"
detail = "Time runs on a continuous clock of working days, with no weekends, holidays or working hours."

[[threats]]
title = "Identical resources"
detail = "Each lane is a pool of identical people who are always available and work on one case at a time. Real people differ in speed, take leave and split their time across projects. The model also has no handoff delays or batching, which the book names as common sources of waiting (§7.1.2, p.261). So the waiting here is a lower bound."

[[threats]]
title = "Quality control runs close to its limit"
detail = "The arrival rate is set so that QC, the busiest lane, runs close to its limit in the as-is process (see arrivals.rate under Assumptions), and the closer a lane gets to full use, the faster its queue grows (§7.2.2, p.276). A few runs build long queues, so as-is runs differ a lot. The book advises checking how results change when one resource is added (§7.3.4, p.287). C4 is that check for QC: one more tester saves {alone_C4} days on its own, so the as-is numbers depend a lot on QC capacity. The to-be numbers depend much less on it: in the full design the same tester saves {full_minus_C4} days."

[[threats]]
title = "The to-be models break the 30-element guideline"
detail = "The to-be models are just over the limit of 7PMG G7 (§5.4.4, p.193); the rule check gives each count. The book's fix is a sub-process, which our simulator doesn't support. The rule check shows this as a warning, not an error."
