<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mô phỏng quy trình</title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
  <style>
    /* No wording in this file: every visible string comes from demo.vi.json,
       every number from replay.json (the sample run) or ../results.json (the official results). */
    :root {
      color-scheme: light;
      --paper: #f3f6f6;
      --surface: #ffffff;
      --lane: #f7f9f9;
      --lane-alt: #edf2f3;
      --ink: #12343b;
      --muted: #4f6870;
      --faint: #8ea3a8;
      --line: #cbd7da;
      --edge: #93a8ad;
      --teal: #2a7f8e;
      --teal-soft: #9dbfc5;
      --orange: #d9622b;
      --orange-ink: #a8441a;
      --orange-soft: #fbe5d9;
      --font: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", sans-serif;
      --bar-h: 76px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      background: var(--paper);
      color: var(--ink);
      font: 16px/1.45 var(--font);
      font-variant-numeric: tabular-nums;
      min-height: 100dvh;
    }
    button { font: inherit; color: inherit; }
    :focus-visible { outline: 3px solid var(--teal); outline-offset: 2px; }

    .top {
      display: flex; align-items: center; justify-content: space-between; gap: 12px 24px; flex-wrap: wrap;
      padding: 12px 16px 8px;
    }
    .top h1 { margin: 0; font-size: 1.45rem; font-weight: 700; letter-spacing: -0.01em; line-height: 1.2; }
    .top p { margin: 2px 0 0; color: var(--muted); font-size: 0.95rem; }
    .top a { color: var(--teal); }

    .views { display: inline-flex; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
    .views button {
      border: 0; background: none; padding: 7px 18px; border-radius: 999px; cursor: pointer; font-weight: 600; font-size: 1rem; color: var(--muted);
    }
    .views button[aria-pressed="true"] { background: var(--ink); color: #fff; }

    main { padding: 0 16px calc(var(--bar-h) + 16px); }
    .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; margin: 0 0 12px; overflow: hidden; }
    .panel-head {
      display: flex; align-items: baseline; justify-content: space-between; gap: 6px 20px; flex-wrap: wrap;
      padding: 10px 16px 8px; border-bottom: 1px solid var(--line);
    }
    .panel-head h2 { margin: 0; font-size: 1.3rem; font-weight: 700; }
    .panel[data-scenario="to_be"] .panel-head h2 { color: var(--teal); }
    .counters { display: flex; flex-wrap: wrap; gap: 4px 26px; margin: 0; }
    .counters div { display: flex; align-items: baseline; gap: 8px; }
    .counters dt { color: var(--muted); font-size: 0.9rem; }
    .counters dd { margin: 0; font-weight: 700; font-size: 1.25rem; min-width: 2.2ch; }
    .counters .qc dd { color: var(--orange-ink); }
    .counters .unit { font-weight: 500; font-size: 0.85rem; color: var(--muted); margin-left: 3px; }

    .flow-scroll { overflow-x: auto; }
    svg.flow { display: block; width: 100%; height: auto; }
    body.compare .top p { display: none; }
    body.compare .top { padding-bottom: 6px; }
    .compare .panel { margin-bottom: 8px; }
    .compare .panel-head { padding: 5px 16px 4px; }
    .compare .panel-head h2 { font-size: 1.15rem; }
    .compare .counters dd { font-size: 1.15rem; }

    .below { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 10px 28px; padding: 10px 16px 12px; border-top: 1px solid var(--line); }
    .legend { display: flex; flex-wrap: wrap; gap: 6px 20px; margin: 0; padding: 0; list-style: none; font-size: 0.92rem; color: var(--muted); }
    .legend li { display: flex; align-items: center; gap: 7px; }
    .legend svg { flex: none; }
    .note { margin: 4px 0 0; font-size: 0.85rem; color: var(--muted); max-width: 80ch; }
    .changes { display: flex; flex-wrap: wrap; gap: 8px 10px; margin: 0; padding: 0; list-style: none; }
    .changes li { display: flex; align-items: baseline; gap: 8px; background: var(--orange-soft); border-radius: 8px; padding: 6px 10px; font-size: 0.92rem; }
    .chip { display: inline-block; background: var(--orange); color: #fff; font-weight: 700; font-size: 0.8rem; border-radius: 5px; padding: 1px 6px; }
    .changes b { font-weight: 600; }

    /* transport bar */
    .bar {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 2; min-height: var(--bar-h);
      display: flex; align-items: center; gap: 10px 22px; flex-wrap: wrap;
      padding: 10px 16px; background: rgba(255, 255, 255, 0.96); border-top: 1px solid var(--line);
      box-shadow: 0 -6px 18px rgba(18, 52, 59, 0.06);
    }
    .bar[hidden] { display: none; }
    .play {
      display: inline-flex; align-items: center; gap: 10px; border: 0; cursor: pointer;
      background: var(--orange); color: #fff; font-weight: 700; font-size: 1.05rem; border-radius: 999px; padding: 11px 22px 11px 18px;
    }
    .play:hover { background: #c4561f; }
    .play svg { width: 16px; height: 16px; fill: currentColor; }
    .clock { display: grid; gap: 4px; flex: 1 1 280px; min-width: 220px; }
    .clock-text { display: flex; justify-content: space-between; gap: 12px; font-size: 0.95rem; }
    .clock-text b { font-size: 1.15rem; }
    .clock-text span { color: var(--muted); }
    .progress { width: 100%; accent-color: var(--orange); margin: 0; }
    .speed { display: flex; align-items: center; gap: 8px; font-size: 0.9rem; color: var(--muted); }
    .speed-buttons { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
    .speed-buttons button { border: 0; background: var(--surface); padding: 6px 11px; cursor: pointer; font-weight: 600; color: var(--muted); }
    .speed-buttons button + button { border-left: 1px solid var(--line); }
    .speed-buttons button[aria-pressed="true"] { background: var(--ink); color: #fff; }
    .qchart { flex: 0 1 330px; min-width: 240px; }
    .qchart h3 { margin: 0 0 2px; font-size: 0.85rem; font-weight: 600; color: var(--muted); display: flex; gap: 14px; flex-wrap: wrap; }
    .qchart h3 .key { display: inline-flex; align-items: center; gap: 5px; font-weight: 500; }
    .qchart .plot { display: block; width: 100%; height: 54px; overflow: visible; }
    .qchart .tip { margin-left: auto; font-weight: 500; color: var(--ink); }

    /* result view */
    .result { padding: 18px 20px 22px; }
    .result h2 { margin: 0 0 4px; font-size: 1.5rem; }
    .result .method { margin: 0 0 18px; color: var(--muted); max-width: 80ch; }
    .result-grid { display: grid; grid-template-columns: minmax(260px, 0.8fr) minmax(320px, 1.4fr); gap: 20px 36px; align-items: start; }
    .big { margin: 0 0 18px; }
    .big .value { font-size: clamp(3rem, 7vw, 5.2rem); font-weight: 700; line-height: 1; letter-spacing: -0.02em; color: var(--teal); }
    .big .value.days { font-size: clamp(2.2rem, 4.6vw, 3.4rem); color: var(--ink); }
    .big .what { font-size: 1.1rem; font-weight: 600; margin-top: 6px; }
    .big .ci { color: var(--muted); font-size: 0.95rem; }
    .goal { display: flex; gap: 10px; align-items: flex-start; background: #e6f1f2; border-radius: 10px; padding: 10px 12px; font-weight: 600; }
    .goal svg { flex: none; margin-top: 2px; }
    .chart-block { margin: 0 0 18px; }
    .chart-block h3 { margin: 0 0 6px; font-size: 1.05rem; }
    .chart-block svg { display: block; width: 100%; height: auto; }
    .result .fine { color: var(--muted); font-size: 0.9rem; margin: 6px 0 0; max-width: 80ch; }

    .error { margin: 24px 16px; padding: 14px 16px; border-radius: 10px; background: var(--orange-soft); color: var(--orange-ink); }

    @media (max-width: 760px) {
      svg.flow { min-width: 980px; }
      .result-grid { grid-template-columns: 1fr; }
      .views button { padding: 6px 12px; }
      :root { --bar-h: 128px; }
      .bar { gap: 8px 14px; padding: 8px 12px; }
      .play { padding: 8px 16px 8px 13px; font-size: 0.95rem; }
      .clock { flex-basis: 180px; min-width: 0; }
      .qchart, #speed-label { display: none; }
      .counters { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 14px; }
      .counters div { flex-direction: column; align-items: flex-start; gap: 0; }
      .counters dt { font-size: 0.8rem; line-height: 1.25; }
      .clock-text { font-size: 0.8rem; flex-wrap: wrap; }
      .clock-text b { font-size: 1rem; }
      .counters dd { font-size: 1.05rem; }
      .top h1 { font-size: 1.2rem; }
    }
  </style>
</head>
<body>
  <header class="top">
    <div>
      <h1 id="title"></h1>
      <p><span id="subtitle"></span> <a id="report" href="../"></a></p>
    </div>
    <nav class="views" id="views"></nav>
  </header>
  <main id="stage"></main>
  <div class="bar" id="bar" hidden>
    <button class="play" id="play" type="button"></button>
    <div class="clock">
      <div class="clock-text"><b id="clock"></b><span id="day"></span></div>
      <input class="progress" id="progress" type="range" min="0" max="1000" value="0">
    </div>
    <div class="speed"><span id="speed-label"></span><div class="speed-buttons" id="speed"></div></div>
    <div class="qchart" id="qchart"></div>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
