[project]
name = "bpmopt"
version = "0.1.0"
description = "Time optimization of the app development process: BPMN simulation, event log analysis and ML."
requires-python = ">=3.12"
dependencies = [
    "jsonschema==4.26.0",
    "numpy==2.5.4",
    "pandas==3.1.0",
    "rfc3339-validator==0.1.4",
    "simpy==4.1.2",
]

[project.optional-dependencies]
dev = [
    "ipykernel==7.4.0",
    "nbclient==0.11.0",
    "nbformat==5.11.1",
    "pytest==9.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bpmopt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
